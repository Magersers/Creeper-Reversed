name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [fabric-1.20.1, forge-1.20.1, fabric-1.21.1, neoforge-1.21.1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew build -Ptarget=${{ matrix.target }} --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: creeper-reversed-${{ matrix.target }}
          path: platforms/${{ matrix.target }}/build/libs/*.jar
