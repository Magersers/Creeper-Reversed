plugins { id 'fabric-loom' version '1.7.4' }
dependencies {
    minecraft 'com.mojang:minecraft:1.21.1'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.16.14'
}
java { toolchain.languageVersion = JavaLanguageVersion.of(21) }
loom {
    mixin { defaultRefmapName = 'creeper_reversed.refmap.json' }
    runs { server { programArg 'nogui' } }
}
base { archivesName = "creeper-reversed-${project.name}" }
sourceSets.main.java.srcDir('../../common/src/main/java')
sourceSets.main.resources.srcDir('../../common/src/main/resources')
sourceSets.test.java.srcDir('../../common/src/test/java')
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.register('fuseTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.github.magersers.creeperreversed.FuseTest'
}
tasks.named('check') { dependsOn 'fuseTest' }
jar { from('../../LICENSE') }
apply from: '../../integration.gradle'

sourceSets.main.java.srcDir('../../versions/1.21.1/src/main/java')
sourceSets.main.resources.srcDir('../../versions/1.21.1/src/main/resources')
