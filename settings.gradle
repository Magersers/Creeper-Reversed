pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.minecraftforge.net/' }
        gradlePluginPortal()
    }
}
rootProject.name = 'Creeper-Reversed'
def target = providers.gradleProperty('target').getOrElse('fabric-1.21.1')
if (!(target in ['fabric-1.20.1', 'forge-1.20.1', 'fabric-1.21.1', 'neoforge-1.21.1'])) {
    throw new GradleException('Unsupported target: ' + target)
}
include(target)
project(":" + target).projectDir = file('platforms/' + target)
